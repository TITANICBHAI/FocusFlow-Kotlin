name: Build tbtechsdev APK

on:
  push:

permissions:
  contents: read

concurrency:
  group: build-tbtechsdev-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble tbtechsdev debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tbtechsdev NewApi lint, unit tests and assemble APK
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:lintTbtechsdevDebug \
            :app:testTbtechsdevDebugUnitTest \
            :app:assembleTbtechsdevDebug \
            --no-daemon --stacktrace

      - name: Upload tbtechsdev debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-tbtechsdev-debug-apk
          path: app/build/outputs/apk/tbtechsdev/debug/app-tbtechsdev-debug.apk
          if-no-files-found: error
          retention-days: 14
