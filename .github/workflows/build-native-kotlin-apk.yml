name: Build Native Kotlin APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-native-kotlin-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble production debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run production NewApi lint, unit tests and assemble APK
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:lintProductionDebug \
            :app:testProductionDebugUnitTest \
            :app:assembleProductionDebug \
            --no-daemon --stacktrace

      - name: Upload production debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-native-debug-apk
          path: app/build/outputs/apk/production/debug/app-production-debug.apk
          if-no-files-found: error
          retention-days: 14